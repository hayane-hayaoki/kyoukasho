<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日本語の発音の仕組み｜府中西高校合唱部 強化書</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Noto+Sans:wght@300;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#f9cad1; --pink-d:#f3b3bd; --air:#e6edf2; --ink:#222; --sub:#666; --line:#ddd;
    --c1:#e8202a; --c2:#00a0e3; --c3:#7cc832; --c4:#8c8c8c; --c5:#8a1f8f; --c6:#ef4b23;
    --thTop:0px; --heroH:60px;
  }
  :root{color-scheme:light only}
  *{box-sizing:border-box}
  button{color:var(--ink)}
  html,body{margin:0;background:#fff;color:var(--ink);
    font-family:"Zen Kaku Gothic New",system-ui,sans-serif;-webkit-text-size-adjust:100%}
  .ipa{font-family:"Noto Sans","Zen Kaku Gothic New",sans-serif;font-weight:700}

  /* ---- 見出し（1行） ---- */
  .hero{max-width:1180px;margin:0 auto;padding:12px 16px 0;position:sticky;top:0;z-index:20;background:#fff}
  @media (max-width:699px){ .hero{padding-top:8px} .hero .brand{display:none} }
  .hero .titlerow{display:flex;align-items:baseline;justify-content:space-between;gap:4px 14px;flex-wrap:wrap;
    padding-bottom:8px;border-bottom:1px solid #222}
  .hero h1{margin:0;font-size:clamp(22px,4.2vw,32px);font-weight:900;letter-spacing:.08em;line-height:1.2;color:#111}
  .hero .brand{font-size:11px;letter-spacing:.25em;color:#888;white-space:nowrap}

  main{max-width:1180px;margin:0 auto;padding:0 16px;display:grid;gap:0;grid-template-columns:1fr}
  @media (max-width:699px){ main{display:block} }
  .figcol{display:contents}

  /* ---- 図・ボタン・説明 ---- */
  .figwrap{position:sticky;top:var(--heroH);z-index:5;background:#fff;margin:0 -16px;padding:8px 16px 4px}
  .fig{display:block;margin:0 auto;height:38vh;height:38svh;width:auto;max-width:100%}
  .info{margin:6px auto 0;max-width:600px;font-size:13px;line-height:1.6;padding:6px 10px;border-radius:12px;background:#faf6f7;
    height:16vh;height:16svh;min-height:104px;overflow-y:auto}
  .info p{margin:4px 0 0}
  .info .ihead{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap}
  .info .big{font-size:22px;font-weight:900;line-height:1.1;min-width:1.2em;text-align:center}
  .info .ipa{font-size:18px}
  .info .iname{font-size:15px}
  .info .icat{color:var(--sub);font-size:12.5px;margin-top:2px}
  .info .num{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;
    color:#fff;font-weight:700;font-size:12px}
  .info .hint{color:var(--sub)}
  .info .tag{display:inline-block;font-size:12px;background:#fff;border:1px solid #e6d3d8;border-radius:999px;padding:1px 9px;margin:2px 4px 0 0;line-height:1.5}
  .seg{display:inline-flex;margin-left:auto;border:1.5px solid #bbb;border-radius:999px;overflow:hidden;font-size:12px;flex:none}
  .seg button{font:inherit;border:0;background:#fff;color:#777;padding:3px 10px;cursor:pointer;line-height:1.4}
  .seg button+button{border-left:1.5px solid #bbb}
  .seg button.on{background:var(--sc);color:#fff;font-weight:700}
  .info .mini{font:inherit;font-size:12px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;padding:2px 10px;cursor:pointer;margin-left:auto}

  /* ボタン（大きさは固定。2行目に今の状態） */
  .ctrls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;max-width:600px;margin:6px auto 0;width:100%}
  .chip{font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;height:40px;
    border:1.5px solid #bbb;background:#fff;color:var(--ink);border-radius:12px;padding:2px 4px;cursor:pointer;min-width:0}
  .chip .nm{font-size:10.5px;color:var(--sub);line-height:1.25;white-space:nowrap}
  .chip .st{font-size:12px;font-weight:700;line-height:1.3;white-space:nowrap}
  #btnVelum{--hc:#8a1f8f;--hb:#f7eaf7;--ht:#8a1f8f}
  #btnEpi{--hc:#d24a7a;--hb:#fdeef3;--ht:#b8325f}
  #btnLar{--hc:#1f8f8a;--hb:#e4f4f3;--ht:#16736f}
  #btnFold{--hc:#ef4b23;--hb:#feeee8;--ht:#d93d17}
  #btnFlow{--hc:#2f7fbf;--hb:#e8f1f9;--ht:#2f7fbf}
  #btnNames{--hc:#666;--hb:#f1f1f1;--ht:#333}
  .chip.on{border-color:var(--hc);background:var(--hb)}
  .chip.on .st{color:var(--ht)}

  /* スマホ：部位の名前の文字を大きく */
  @media (max-width:699px){
    #names text:first-of-type{font-size:6.2px}
    #names text:last-of-type{font-size:13px}
    #vfPanel text{font-size:12.5px}
  }

  /* ---- タブレット縦など（700px〜）：左に 図・ボタン・説明、右に表 ---- */
  @media (min-width:700px){
    main{grid-template-columns:minmax(0,1fr) 316px;align-items:start;gap:0 18px}
    .figcol{padding-top:8px}
    .figcol{display:block;position:sticky;top:var(--heroH)}
    .figwrap{position:static;border-bottom:none;box-shadow:none;margin:0;padding:0}
    .fig{height:auto;width:100%;max-height:calc(100vh - var(--heroH) - 300px);max-height:calc(100svh - var(--heroH) - 300px);min-height:300px}
    .ctrls,.info{max-width:none}
    .info{height:190px;font-size:13.5px;padding:8px 12px}
    .info .big{font-size:26px}
    .chip .nm{font-size:11.5px} .chip .st{font-size:13px}
  }
  /* ---- 横長の画面（iPad横・パソコン）：図を画面の高さいっぱいに。ボタンと説明は右上 ---- */
  @media (min-width:1100px) and (min-aspect-ratio:5/4){
    .hero,main{max-width:1600px}
    main{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 22px}
    .figcol,.figwrap{display:contents}
    #fig{grid-column:1;position:sticky;top:calc(var(--heroH) + 8px);align-self:start;
      height:calc(100vh - var(--heroH) - 16px);height:calc(100svh - var(--heroH) - 16px);max-height:none;min-height:0}
    .rightcol{grid-column:2;grid-row:1}
    .panel{position:sticky;top:var(--heroH);z-index:6;background:#fff;padding:8px 0}
    .info{margin:8px 0 0;height:178px}
    .tbl,.vrow{max-width:440px;margin-left:auto;margin-right:auto}
    #fig{grid-row:1}
  }

  /* SVG まわり */
  svg text{font-family:"Zen Kaku Gothic New",sans-serif}
  #veil{transition:opacity .25s;pointer-events:none}
  .hl{opacity:0;transition:opacity .25s;pointer-events:none}
  .hl.on{opacity:1}
  .hl .halo{opacity:0}
  .hl.on .halo{animation:halo 1.3s ease-in-out infinite}
  @keyframes halo{0%,100%{opacity:.15}50%{opacity:.95}}
  .mvFold,.mvEpiDots{display:none}
  .lbl{transition:opacity .3s}
  #fig.nolbl .lbl{opacity:0}
  .vg.on path{fill:#d6336c;stroke:#d6336c}
  #names .nm{opacity:0;transition:opacity .3s;pointer-events:none}
  #names.show .nm,#names .nm.peek{opacity:1}
  .flow{fill:none;stroke:#2f7fbf;stroke-width:3;stroke-linecap:round;opacity:.75;
    animation:flow .45s linear infinite;stroke-dasharray:1.5 6;stroke-dashoffset:var(--o,0px)}
  @keyframes flow{from{stroke-dashoffset:var(--o,0px)}to{stroke-dashoffset:calc(var(--o,0px) - 7.5px)}}

  /* ---- 表（1枚の表。①〜⑥の見出しで区切る） ---- */
  .tbl{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
  .tbl col.cb{width:30px} .tbl col.ci{width:44px}
  .vrow{display:grid;grid-template-columns:30px 44px repeat(5,minmax(0,1fr));column-gap:0;position:sticky;top:var(--thTop);z-index:4;
    background:#fff;padding:6px 0;border-bottom:1.5px solid #f0c9d3}
  @media (max-width:699px){ .vrow{margin:0 -16px;padding:6px 16px;box-shadow:0 6px 10px -8px rgba(0,0,0,.18)} }
  .vrow .vh{margin:0 3px;width:auto}
  /* い え あ お う：表の文字と同じ大きさの、押せるボタン（枠だけ） */
  .vh{font:inherit;font-size:21px;font-weight:500;color:#d6336c;cursor:pointer;height:38px;
    background:#fff;border:1.2px solid #eeaabd;border-radius:10px;padding:0;line-height:1}
  @media (hover:hover){ .vh:hover{background:#fdf3f6} }
  /* 表の文字を選んだ時：対応する母音を控えめに */
  .vh.hint{background:#fdeef3;border-color:#d6336c;border-width:2px}
  .vh.on,.vh.on:hover{background:#d6336c;border-color:#d6336c;color:#fff}
  .card .gh td{padding:14px 0 4px;vertical-align:middle}
  .card:first-of-type .gh td{padding-top:8px}
  .card .gh td.band{text-align:center}
  .card .gh .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--cc);vertical-align:middle;
    color:#fff;font-family:"Noto Sans",sans-serif;font-weight:700;font-size:15px;cursor:pointer}
  .card h2{margin:0;display:inline-flex;align-items:baseline;gap:8px;font-size:19px;font-weight:700;cursor:pointer;color:var(--cc);
    background:none;border:0;padding:2px 12px 2px 4px;font-family:inherit;text-align:left;border-radius:999px;line-height:1.3}
  .card h2 .yomi{font-size:11px;font-weight:500;color:var(--sub);letter-spacing:.08em}
  .card.on h2{background:color-mix(in srgb,var(--cc) 12%,#fff)}
  .card td{padding:0;text-align:center}
  /* 色の縦線：丸数字の中心にそろえ、グループの中は途切れず1本に */
  .card td.band{background:linear-gradient(var(--cc),var(--cc)) center / 3px 100% no-repeat;opacity:.75}
  .card .gh td.band{background:linear-gradient(var(--cc),var(--cc)) center bottom / 3px 50% no-repeat;opacity:1}
  .card.on .gh td.band{background-size:4px 50%}
  .card .gh td:not(.band){text-align:left}
  .card tr:last-child td.band{background-size:3px calc(100% - 8px);background-position:center top}
  .card.on td.band{background-size:4px 100%;opacity:1}
  .card.on tr:last-child td.band{background-size:4px calc(100% - 8px)}
  .cons{font-size:18px;color:#888;font-weight:600}
  .k{font:inherit;font-size:21px;border:0;background:none;padding:0;border-radius:10px;cursor:pointer;
    color:var(--ink);width:100%;height:44px;white-space:nowrap}
  .k.s{font-size:16px}
  .k:empty{pointer-events:none}
  @media (hover:hover){ .k:not(:empty):hover{background:rgba(0,0,0,.05)} }
  .k.on,.k.on:hover{background:var(--cc);color:#fff}
  .bd{position:relative;display:inline-block}
  .bd::after{content:'';position:absolute;right:-.2em;top:-.02em;width:.3em;height:.3em;border:.075em solid currentColor;border-radius:50%;box-sizing:border-box}

  .notes{margin:16px 0 0;padding:0 0 24px;display:grid;gap:12px}
  .notes h3{margin:0 0 4px;font-size:15px}
  .notes ul{margin:0;padding:14px 16px 14px 30px;background:#f6f8fa;border-radius:14px;font-size:14px;line-height:1.8}
  .notes .howto ul{background:#faf6f7}
  footer{text-align:center;font-size:12px;color:#999;padding:0 0 24px}
</style>

</head>

  {id:4, name:'口蓋音', ruby:'こうがいおん', desc:'舌のまん中あたりを、上あごのまん中あたりに近づけて作る音', rows:[

  {id:5, name:'軟口蓋音', ruby:'なんこうがいおん', desc:'舌の奥を、上あごの奥のやわらかいところ（軟口蓋）に当てて作る音', rows:[
    ['k',['き','け','か','こ','く']],['g',['ぎ','げ','が','ご','ぐ']],['ŋ',['き゚','け゚','か゚','こ゚','く゚'],1]]},
  {id:6, name:'声門音', ruby:'せいもんおん', desc:'声帯のすき間を息が通るときに出る音', rows:[
    ['h',['','へ','は','ほ','']]]},
];
const COL = {1:'var(--c1)',2:'var(--c2)',3:'var(--c3)',4:'var(--c4)',5:'var(--c5)',6:'var(--c6)'};

// ===== 1音ずつの説明 =====
const NASAL_HEAD = '鼻音：口の中を完全にふさいだまま軟口蓋を下げて、声を鼻からだけ出す音です（母音で鼻に抜けすぎる「開鼻声」とは別もの）。';
const NOTE = {
  m:  NASAL_HEAD+'<br>「ま行」は、上下のくちびるを閉じて口の出口をふさぎます。くちびるを開くと、そのまま母音につながります。',
  'ɸ':'上下のくちびるを近づけて、狭いすき間から息をこすらせて出します。ろうそくの火を、そっと吹く時の形に近いです。',
  p:  '上下のくちびるを閉じて息をせき止め、パッと開いて破裂させます。',
  b:  '「p」と同じ形で、声帯をふるわせながら出します。',
  w:  '上下のくちびるを少し近づけるだけで、くっつけません。舌は動かしません。すぐに母音につながります。',
  s:  '舌先を上の歯ぐき（2番）に近づけて、狭いすき間から息をこすらせて「スー」と出します。',
  dz: '舌先を2番にほんの一瞬くっつけてから、すぐ離して、すき間から息をこすらせます。くっつくのはごく一瞬なので、図では「s」と同じ形で見せています。',
  t:  '舌先を2番にくっつけて息をせき止め、パッと離します。',
  d:  '「t」と同じ動きで、声帯をふるわせます。',
  ts: '「dz」と同じ動きで、声帯はふるえません。舌先を2番にほんの一瞬くっつけてから、すぐ離して息をこすらせます（図では「s」と同じ形で見せています）。',
  n:  NASAL_HEAD+'<br>「な行」は、舌先を2番にくっつけて口の中をふさぎます。',
  'ɾ':'舌先が2番に一瞬だけ触れて離れます。強くはじくのではなく、ほかの子音と同じタイミングでくっついて離れます。触れている一瞬も、息と声は舌の両わきを通って、止まらずに口から流れ続けます。',
  'ɕ':'舌の前の方（3番）を上あごの硬いところに近づけて、すき間から息をこすらせます。',
  'dʑ':'「し」と同じ場所で、声帯をふるわせます。破裂する瞬間はなく、すき間から息を流します。',
  'tɕ':'「し」と同じ場所で、すき間から息を流します。破裂する瞬間はありません。',
  j:  '舌のまん中（4番）を上あごに近づけるだけで、くっつけません。そのまま母音につながります。',
  'ç':'舌のまん中（4番）を上あごに近づけて、すき間から息をこすらせます。',
  k:  '舌の奥（5番）を軟口蓋（5番）にくっつけて息をせき止め、パッと離します。舌の4番はくっつきません。',
  g:  '「k」と同じ動きで、声帯をふるわせます。',
  'ŋ':NASAL_HEAD+'<br>「か゚行」（鼻濁音）は、舌の奥（5番）で口の中をふさぎます。が行をやわらかく歌う時に使います。',
  h:  '口の中はどこもふさがず、声帯のすき間を息が通る音です。'};
const NOTE_SOFT = {
  k:'舌の奥（5番）を軟口蓋に近づけますが、くっつききらずに、狭いすき間から息を流し続けます（破裂しない発音。例：「きた」の「き」）。',
  g:'舌の奥（5番）を軟口蓋に近づけますが、くっつききらずに、狭いすき間から声と息を流し続けます（破裂しない発音）。',
  b:'くちびるを閉じきらずに、狭いすき間から声と息を流し続けます（破裂しない発音）。'};
const VNOTE={
  'い':'舌先は下の前歯の裏に置いたまま、舌の前の方（2番）が上あごに向かって高く盛り上がります。口の中の前の方がせまく、奥が広くなります。',
  'え':'舌の前の方が持ち上がりますが、「い」より低めです。',
  'あ':'舌全体が下がって平らになり、口の中がいちばん広くなります。',
  'お':'舌の奥の方が少し持ち上がります。くちびるは動かしません。',
  'う':'舌の奥（5番）が、軟口蓋に向かって持ち上がります。くちびるは動かしません。'};

const fig = document.getElementById('fig');
const info = document.getElementById('info');
const cardsEl = document.getElementById('cards');

// 表を作る（①〜⑥の見出しで区切った1枚の表）

// ===== 絵をじわーっと動かす仕組み =====
const ss = (a,b,x)=>{ const t=Math.min(1,Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); };

const quad=(a,c,b,n)=>{ const out=[]; for(let k=0;k<=n;k++){ const t=k/n; out.push([(1-t)**2*a[0]+2*(1-t)*t*c[0]+t*t*b[0], (1-t)**2*a[1]+2*(1-t)*t*c[1]+t*t*b[1]]); } return out; };

// 上あごの下面（色線の位置）と、舌の表面（色線の位置）
const PAL0 = chain([[[99.5,463],[104.7,450.3],[116.5,439.8]],[[116.5,439.8],[147.3,425.4],[193.1,425.4]],[[193.1,425.4],[235.6,425.4],[265.1,437.2]],[[265.1,437.2],[301.1,451.6],[320.7,487.6]]],24);
const TON0 = chain([[[126.3,511.8],[125.7,500.7],[132.2,492.2]],[[132.2,492.2],[157.1,466],[193.1,464.7]],[[193.1,464.7],[229.1,466],[252,480.4]],[[252,480.4],[278.2,494.1],[293.2,521]]]);
const yAt=(poly,x)=>{
  if(x<=poly[0][0]) return poly[0][1];
  for(let i=1;i<poly.length;i++){ const [x0,y0]=poly[i-1],[x1,y1]=poly[i]; if((x>=x0&&x<=x1)||(x<=x0&&x>=x1)){ const t=(x-x0)/((x1-x0)||1e-6); return y0+(y1-y0)*t; } }
  return poly[poly.length-1][1];
};
let palNow = PAL0;
const palSlopeK = x=>{ const m=(yAt(palNow,x+1.5)-yAt(palNow,x-1.5))/3; return Math.sqrt(1+m*m); };

// --- 舌の表面の線（元の形）。舌の付け根まで少し延ばし、等間隔の点に並べ直す ---
const T_MAIN=[...TON0, ...quad([293.2,521],[306,543],[291,573],16).slice(1)];
const tmS=[0]; for(let i=1;i<T_MAIN.length;i++) tmS.push(tmS[i-1]+Math.hypot(T_MAIN[i][0]-T_MAIN[i-1][0],T_MAIN[i][1]-T_MAIN[i-1][1]));
const LEN_T=tmS[TON0.length-1], S_J=tmS[10];
const DS=1.5, S_MIN=-30, S_MAX=tmS[tmS.length-1];
const NS=Math.floor((S_MAX-S_MIN)/DS)+1;
const TS=new Float64Array(NS), TX0=new Float64Array(NS), TY0=new Float64Array(NS), TNX0=new Float64Array(NS), TNY0=new Float64Array(NS);
{
  const t0x=TON0[1][0]-TON0[0][0], t0y=TON0[1][1]-TON0[0][1], l0=Math.hypot(t0x,t0y);
  let j=0;
  for(let k=0;k<NS;k++){
    const s=S_MIN+k*DS; TS[k]=s;
    if(s<0){ TX0[k]=TON0[0][0]+t0x/l0*s; TY0[k]=TON0[0][1]+t0y/l0*s; continue; }
    while(j<tmS.length-2 && tmS[j+1]<s) j++;
    const t=Math.min(1,(s-tmS[j])/((tmS[j+1]-tmS[j])||1));
    TX0[k]=T_MAIN[j][0]+(T_MAIN[j+1][0]-T_MAIN[j][0])*t; TY0[k]=T_MAIN[j][1]+(T_MAIN[j+1][1]-T_MAIN[j][1])*t;
  }
}
function normalsOf(X,Y,NX,NY){
  for(let k=0;k<NS;k++){ const a=Math.max(0,k-2), b=Math.min(NS-1,k+2); const tx=X[b]-X[a], ty=Y[b]-Y[a], l=Math.hypot(tx,ty)||1; NX[k]=-ty/l; NY[k]=tx/l; }
}
normalsOf(TX0,TY0,TNX0,TNY0);
// 今の舌の表面
const CX=Float64Array.from(TX0), CY=Float64Array.from(TY0), CNX=Float64Array.from(TNX0), CNY=Float64Array.from(TNY0);
const DX=new Float64Array(NS), DY=new Float64Array(NS);
function evalC(s,n,X,Y,NX,NY){
  let f=(s-S_MIN)/DS; f=Math.max(0,Math.min(NS-1.0001,f)); const k=Math.floor(f), t=f-k;
  return [X[k]+(X[k+1]-X[k])*t + n*(NX[k]+(NX[k+1]-NX[k])*t), Y[k]+(Y[k+1]-Y[k])*t + n*(NY[k]+(NY[k+1]-NY[k])*t)];
}
// 点が、舌の表面のどこ（s）から、どれだけ深い所（n）にあるか
function projT(x,y){
  let best=1e18, bk=0, bt=0;
  for(let k=0;k<NS-1;k++){
    const ax=TX0[k], ay=TY0[k], vx=TX0[k+1]-ax, vy=TY0[k+1]-ay, L2=vx*vx+vy*vy;
    let t=((x-ax)*vx+(y-ay)*vy)/L2; t=t<0?0:t>1?1:t;
    const dx=x-ax-t*vx, dy=y-ay-t*vy, d2=dx*dx+dy*dy;
    if(d2<best){ best=d2; bk=k; bt=t; }
  }
  const s=TS[bk]+bt*DS, fx=TX0[bk]+(TX0[bk+1]-TX0[bk])*bt, fy=TY0[bk]+(TY0[bk+1]-TY0[bk])*bt;
  const nx=TNX0[bk]+(TNX0[bk+1]-TNX0[bk])*bt, ny=TNY0[bk]+(TNY0[bk+1]-TNY0[bk])*bt;
  return [s,(x-fx)*nx+(y-fy)*ny];
}
// 舌と一緒に動く度合い（境目でスパッと切らず、なだらかに）
function tongueInfo(x0,y0){
  if(x0<95||x0>352||y0<440||y0>612) return null;
  const [s,n]=projT(x0,y0);
  let w = ss(-12,-5,n)*ss(48,26,n);
  w *= ss(-32,-16,s)*(1-ss(S_MAX-8,S_MAX+6,s));
  w *= 1-ss(180,150,x0)*ss(526,533,y0);   // 舌の下の、口の底は動かさない
  w *= ss(100,108,x0);
  if(w<=0) return null;
  const [ex,ey]=evalC(s,n,TX0,TY0,TNX0,TNY0);
  return {s,n,w,dx:x0-ex,dy:y0-ey};
}

// --- 上あご：3番の奥から先までを1本の背骨としてしなやかに曲げる ---
let VCURL=55, VST=0.035;
const SP=(()=>{
  const pts=PAL0.filter(p=>p[0]>=199);
  const th=[]; for(let i=0;i<pts.length-1;i++) th.push(Math.atan2(pts[i+1][1]-pts[i][1],pts[i+1][0]-pts[i][0])*180/Math.PI);
  const s=[0]; for(let i=1;i<pts.length;i++) s.push(s[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const len=s[s.length-1];
  const d=pts.map(()=>0); d[0]=-th[0];
  for(let i=1;i<th.length;i++) d[i]=-(th[i]-th[i-1]);
  for(let i=0;i<pts.length;i++){ const u=s[i]/len; d[i]+= VCURL*(ss(0.6,0.98,u)-ss(0.6,0.98,(s[i-1]??0)/len)); }
  return {pts,d,s,len};
})();
let spineDist=0;
function spineParam(x,y){
  let best=1e9, bs=0;
  for(let i=0;i<SP.pts.length-1;i++){
    const [ax,ay]=SP.pts[i],[bx,by]=SP.pts[i+1], vx=bx-ax, vy=by-ay, L2=vx*vx+vy*vy;
    let t=((x-ax)*vx+(y-ay)*vy)/L2; t=Math.max(0,Math.min(1,t));
    const dd=Math.hypot(x-ax-t*vx,y-ay-t*vy);
    if(dd<best){ best=dd; bs=SP.s[i]+t*Math.sqrt(L2); }
  }
  spineDist=best;
  return bs;
}
const VL = x=>Math.max(456, 445+(x-262));
function velumDef(x0,y0,v){
  if(v<0.001 || !(x0>195 && x0<328 && y0>380 && y0<VL(x0)+1)) return [x0,y0];
  const sp=spineParam(x0,y0); let x=x0, y=y0;
  const near=ss(34,24,spineDist); if(near<=0) return [x0,y0];
  for(let i=SP.pts.length-2;i>=0;i--){
    const w=ss(SP.s[i]-3, SP.s[i]+3, sp);
    if(w>0) [x,y]=rot(x,y,SP.pts[i][0],SP.pts[i][1],SP.d[i]*v*w*near);
  }
  const R=SP.pts[0], k=1+VST*v*near*ss(0.35,1,sp/SP.len);
  return [R[0]+(x-R[0])*k, R[1]+(y-R[1])*k];
}

// --- 喉頭蓋：根元を支点に、葉っぱのようにしなって倒れる ---
// 起き上がる(-0.2) → 元の絵(0) → 倒れがち(0.5) → フタ(1)
const EPI_B=[300,601], EPI_T=[318.5,571.5];
const EPI_L=Math.hypot(EPI_T[0]-EPI_B[0],EPI_T[1]-EPI_B[1]);
const EPI_U=[(EPI_T[0]-EPI_B[0])/EPI_L,(EPI_T[1]-EPI_B[1])/EPI_L], EPI_N=[-EPI_U[1],EPI_U[0]];
const EPI_UP=-0.2;
const along=(h)=>[EPI_B[0]+EPI_U[0]*h, EPI_B[1]+EPI_U[1]*h];
let EKF=[
  [EPI_UP, ...[along(EPI_L/3),along(EPI_L*2/3),EPI_T].map(p=>rot(p[0],p[1],EPI_B[0],EPI_B[1],-8))],
  [0,   along(EPI_L/3), along(EPI_L*2/3), EPI_T],
  [0.5, along(11), [323,581], [331,596]],
  [1,   along(11), [326,601], [331,622]]];
let EPC=null;
function epiCurve(e){
  let i=0; while(i<EKF.length-2 && e>EKF[i+1][0]) i++;
  const a=EKF[i], b=EKF[i+1], t=Math.max(0,Math.min(1,(e-a[0])/(b[0]-a[0])));
  const L=(p,q)=>[p[0]+(q[0]-p[0])*t, p[1]+(q[1]-p[1])*t];
  return [EPI_B, L(a[1],b[1]), L(a[2],b[2]), L(a[3],b[3])];
}
const bez=(P,t)=>{ const m=1-t; return [m*m*m*P[0][0]+3*m*m*t*P[1][0]+3*m*t*t*P[2][0]+t*t*t*P[3][0], m*m*m*P[0][1]+3*m*m*t*P[1][1]+3*m*t*t*P[2][1]+t*t*t*P[3][1]]; };
const bezD=(P,t)=>{ const m=1-t; return [3*m*m*(P[1][0]-P[0][0])+6*m*t*(P[2][0]-P[1][0])+3*t*t*(P[3][0]-P[2][0]), 3*m*m*(P[1][1]-P[0][1])+6*m*t*(P[2][1]-P[1][1])+3*t*t*(P[3][1]-P[2][1])]; };
function epiDef(x0,y0,e){
  if(Math.abs(e)<0.001 || !EPC) return null;
  const vx=x0-EPI_B[0], vy=y0-EPI_B[1];
  const u=(vx*EPI_U[0]+vy*EPI_U[1])/EPI_L, n=vx*EPI_N[0]+vy*EPI_N[1];
  if(u<0 || u>1.35) return null;
  const wn=ss(-24,-12,n)*ss(15,9,n); if(wn<=0) return null;
  let p, d;
  if(u<=1){ p=bez(EPC,u); d=bezD(EPC,u); }
  else { p=bez(EPC,1); d=bezD(EPC,1); const l=Math.hypot(d[0],d[1]); p=[p[0]+d[0]/l*(u-1)*EPI_L, p[1]+d[1]/l*(u-1)*EPI_L]; }

  const n2=n*(1-0.25*Math.max(0,e)*ss(0.4,1.1,u));

// --- 喉仏（声帯の位置）が下がる ---
const LAR_D=32;

// --- 舌の形：舌の上の線は、いつも「山ひとつ」のなめらかな1本のカーブ ---
const sAtX=x=>{ for(let k=0;k<NS;k++) if(TS[k]>S_J*0.5 && TX0[k]>=x) return TS[k]; return LEN_T; };

const VP={

  gAir:'A', gDiv:'T',gHy1:'T',gHy2:'T',e54093:'T',e58193:'T',foldClosed:'T'};
const shapes = ANIM_IDS.map(id=>{
  const el=document.getElementById(id); const rigid=RIGID.includes(id), part=PART_OF[id]||'A';
  if(rigid){
    const toks=el.getAttribute('d').match(/[MLCZ]|-?\d+\.?\d*/g), nums=toks.map(t=>/^[MLCZ]$/.test(t)?null:parseFloat(t));
    const xs=[],ys=[]; for(let i=0;i<nums.length;i++){ if(nums[i]!==null){ xs.push(nums[i]); ys.push(nums[i+1]); i++; } }
    return {el,rigid,part,toks,nums,cx:(Math.min(...xs)+Math.max(...xs))/2, cy:(Math.min(...ys)+Math.max(...ys))/2};
  }

  const f=flatten(el.getAttribute('d'),8), subs=[]; let cur=null;
  for(let i=0;i<f.length;){
    const c=f[i];
    if(c==='M'){ cur={pts:[[f[i+1],f[i+2]]],closed:false}; subs.push(cur); i+=3; }
    else if(c==='L'){ const p=[f[i+1],f[i+2]], q=cur.pts[cur.pts.length-1]; if(Math.hypot(p[0]-q[0],p[1]-q[1])>0.05) cur.pts.push(p); i+=3; }
    else { cur.closed=true; i++; }
  }
  subs.forEach(sb=>{
    if(sb.closed && sb.pts.length>2){ const a=sb.pts[0], b=sb.pts[sb.pts.length-1]; if(Math.hypot(a[0]-b[0],a[1]-b[1])<0.05) sb.pts.pop(); }
    sb.pre = (part==='D'||part==='A') ? sb.pts.map(([x,y])=>tongueInfo(x,y)) : null;
    // 元の絵の「角」（とがった所）は、角のまま残す
    const n=sb.pts.length; sb.corner=sb.pts.map((p,i)=>{
      if(!sb.closed && (i===0||i===n-1)) return true;
      const a=sb.pts[(i-1+n)%n], c=sb.pts[(i+1)%n];
      const v1=[p[0]-a[0],p[1]-a[1]], v2=[c[0]-p[0],c[1]-p[1]];
      const cos=(v1[0]*v2[0]+v1[1]*v2[1])/((Math.hypot(...v1)*Math.hypot(...v2))||1);
      return cos<0.82;
    });
  });

});
const fx2=v=>v.toFixed(2);
let bandNow=false;   // 色線（舌の番号の線）を描いている時は、舌の下側の調整をしない
const BANDS=new Set(['e46988','e47614','e48338','e48525','e49071']);
function pathOf(sh){
  if(sh.rigid){
    const [nx,ny]=deform(sh.cx,sh.cy,sh.part), ox=nx-sh.cx, oy=ny-sh.cy, out=[];
    for(let i=0;i<sh.toks.length;i++){ if(sh.nums[i]===null) out.push(sh.toks[i]); else { out.push(fx2(sh.nums[i]+ox), fx2(sh.nums[i+1]+oy)); i++; } }
    return out.join(' ');
  }
  let d=''; bandNow=BANDS.has(sh.el.id);
  for(const sb of sh.subs){
    const P=sb.pts.map(([x,y],i)=>deform(x,y,sh.part,sb.pre?sb.pre[i]:null)), n=P.length, cl=sb.closed;
    d+=`M${fx2(P[0][0])} ${fx2(P[0][1])}`;
    const m = cl ? n : n-1;
    for(let i=0;i<m;i++){
      const i1=(i+1)%n, p1=P[i], p2=P[i1];
      if(sb.corner[i] && sb.corner[i1]){ d+=`L${fx2(p2[0])} ${fx2(p2[1])}`; continue; }
      const p0 = sb.corner[i] ? p1 : P[(i-1+n)%n], p3 = sb.corner[i1] ? p2 : P[(i+2)%n];
      d+=`C${fx2(p1[0]+(p2[0]-p0[0])/6)} ${fx2(p1[1]+(p2[1]-p0[1])/6)} ${fx2(p2[0]-(p3[0]-p1[0])/6)} ${fx2(p2[1]-(p3[1]-p1[1])/6)} ${fx2(p2[0])} ${fx2(p2[1])}`;
    }
    if(cl) d+='Z';
  }
  return d;
}

const smoothPath=pts=>{
  let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
    d+=` C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)},${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)},${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
};
function resample(pts,step){
  const out=[pts[0]]; let acc=0;
  for(let i=1;i<pts.length;i++){
    let [ax,ay]=pts[i-1]; const [bx,by]=pts[i]; let seg=Math.hypot(bx-ax,by-ay);
    while(acc+seg>=step){ const t=(step-acc)/seg; ax+= (bx-ax)*t; ay+=(by-ay)*t; out.push([ax,ay]); seg=Math.hypot(bx-ax,by-ay); acc=0; }
    acc+=seg;
  }
  const last=pts[pts.length-1], q=out[out.length-1]; if(Math.hypot(last[0]-q[0],last[1]-q[1])>step*0.3) out.push(last); else out[out.length-1]=last;
  return out;
}
function relax(pts,it,a,h=1){ for(let r=0;r<it;r++) for(let i=h;i<pts.length-1;i++){ pts[i]=[pts[i][0]+a*((pts[i-1][0]+pts[i+1][0])/2-pts[i][0]), pts[i][1]+a*((pts[i-1][1]+pts[i+1][1])/2-pts[i][1])]; } return pts; }
let TRUNK=[[304,764],[300,746],[295,728],[290,710],[287,695],[288,682],[293,668],[300,652],[308,636],[316,620],[322,604],[326,588],[328,574]];   // 気管のまん中から、声帯のすき間を通って、のどへ   // 声帯のすき間を通り、曲がる向きがずっと同じ（S字にならない）1本のカーブ   // 分かれ目は低めにして、口への線がゆるやかに曲がれるようにする

const INC_PAIRS=[[105.5,465,14],[104.2,473,9],[102.8,481,4],[101.5,488,0]];
let flowOn=false;
let FLOW_TURN=30, MOUTH_X=312, MOUTH_DY=45, MOUTH_H1=0.25, MOUTH_H2=0.4;   // 分かれ目から、口へ向かって曲がり終えるまでの長さ
function drawFlows(){
  const fT=document.getElementById('flowTrunk'), fM=document.getElementById('flowMouth'), fN=document.getElementById('flowNose');
  const tap = gest && kindKey(gest.ipa)==='tap';
  let oral=0; for(const key of [tap?null:'c2','c3','c4','c5']) if(key) oral=Math.max(oral, state[key]*ss(9,7.2,state.gap));
  oral=Math.max(oral, state.lips*ss(1.5,-0.3,state.lipGap));
  const lid = 1-ss(0.7,0.95,state.epi);
  const oN = flowOn ? (1-ss(0.3,0.5,state.velum))*lid : 0;
  let oM = flowOn ? (1-ss(0.75,0.97,oral))*lid : 0;
  if(tap) oM *= 1-0.65*state.c2*ss(9,7.2,state.gap);   // ら行：舌が触れる一瞬は、息は舌の両わきを通る
  fN.style.opacity=oN*.9; fM.style.opacity=oM*.9; fT.style.opacity=Math.max(oN,oM)*.9;
  if(!flowOn) return;
  // 喉頭蓋の先と、のどの奥の壁の間を通す
  const et=deform(EPI_T[0],EPI_T[1],'D'), wallX=353;
  const trunk=TRUNK.map(([x,y])=>{ let nx=x, ny=y+larDy(x,y,state.lar);
    
    return [nx,ny]; });
  relax(trunk,6,0.4);
  fT.setAttribute('d', smoothPath(trunk));
  // のどの線の先（F）から、口へ行く線と鼻へ行く線に枝分かれ（重ならないように）
  const F=trunk[trunk.length-1], F0=trunk[trunk.length-2], fl=Math.hypot(F[0]-F0[0],F[1]-F0[1]);
  const ftx=(F[0]-F0[0])/fl, fty=(F[1]-F0[1])/fl;

  const Fa=[F[0]+ftx*4, F[1]+fty*4], F1=[F[0]+ftx*8, F[1]+fty*8];
  // 点線の模様が、のどの線から枝へ途切れずにつながるようにする
  const ph=(fT.getTotalLength()%7.5).toFixed(2)+'px';
  fM.style.setProperty('--o',ph); fN.style.setProperty('--o',ph);
  // 口の中：上あごと舌のすき間の真ん中を通る
  // 向かい合う舌の点は、今の舌の形の中で一番近い点を、決めておいた点の近くから探す（舌が奥へ引っこんでも、すき間のまん中を通る）
  const mid=FLOW_PAIRS.map(([i,k0])=>{ const P=palNow[i]; let best=1e9,bk=k0;
    for(let k=Math.max(0,k0-40);k<=Math.min(NS-1,k0+40);k++){ if(TS[k]<0||TS[k]>LEN_T+12) continue; const [rx,ry]=rootShift(TX0[k],TY0[k]); const d=Math.hypot(CX[k]+rx-P[0],CY[k]+ry-P[1]); if(d<best){best=d;bk=k;} }

  { const E=[101,490]; let best=1e9, bq=null;
    for(let k=0;k<NS;k++){ if(TS[k]<-12||TS[k]>60) continue; const qx=CX[k]-CNX[k]*4, qy=CY[k]-CNY[k]*4, d=Math.hypot(qx-E[0],qy-E[1]); if(d<best){best=d;bq=[qx,qy];} }
    while(mid.length && mid[mid.length-1][0]<Math.max(E[0],bq[0])+2 && mid[mid.length-1][1]>E[1]-22) mid.pop();
    mid.push([(E[0]+bq[0])/2,(E[1]+bq[1])/2]); }

  while(mid.length>1 && mid[0][0]>MOUTH_X) mid.shift();

  while(mid.length>1 && (mid[0][1]>F1[1]-10 || Math.hypot(mid[0][0]-F[0],mid[0][1]-F[1])<FLOW_TURN)) mid.shift();
  // 口への線：分かれ目からすぐ、少しずつ口の方へ傾いていく（鼻への線と並んで走らない）
  const STEM=[0,3,6].map(l=>[F[0]+ftx*l, F[1]+fty*l]), S0=STEM[STEM.length-1];
  // 口の入口：ふだんは口の奥の少し前。軟口蓋が上がっている時（舌の奥とのすき間を通る時）は、軟口蓋の先と舌の付け根の間へ（なめらかに切り替える）
  const Xth=MOUTH_X+40*Math.max(state.velum,state.c5);
  let mi=0; while(mi<mid.length-2 && (mid[mi][0]>Xth || mid[mi][1]>S0[1]-MOUTH_DY)) mi++;

  if(mi>0 && mid[mi-1][0]>Xth && mid[mi][0]<Xth){ const f=(mid[mi-1][0]-Xth)/(mid[mi-1][0]-mid[mi][0]); M=[mid[mi-1][0]+(mid[mi][0]-mid[mi-1][0])*f, mid[mi-1][1]+(mid[mi][1]-mid[mi-1][1])*f]; mi--; }
  const M2=mid[Math.min(mi+3,mid.length-1)]||tooth; let mx=M2[0]-M[0], my=M2[1]-M[1]; const ml=Math.hypot(mx,my)||1; mx/=ml; my/=ml;

  const nh=head.length-1;

  let np=resample([S0,...NOSE.filter(p=>p[1]<S0[1]-12)],5); np=[...STEM,...np.slice(1)]; relax(np,4,0.4,STEM.length);

function lerpPath(a,b,t){ const na=a.match(/-?\d+\.?\d*/g).map(Number), nb=b.match(/-?\d+\.?\d*/g).map(Number); let i=0;
  return a.replace(/-?\d+\.?\d*/g,()=>{ const v=na[i]+(nb[i]-na[i])*t; i++; return v.toFixed(2); }); }

const vfEl = id=>document.getElementById(id);
function drawVF(now){
  const f=state.fold;
  if(Math.abs(f-lastFold)>=0.002){
    lastFold=f;
    for(const id in VFP) vfEl(id).setAttribute('d', lerpPath(VFP[id][0],VFP[id][1],f));

  const amp=ss(0.6,0.95,f), ph=0.5+0.5*Math.sin((now||0)*0.055), j=amp*1.3*ph;
  if(Math.abs(j-lastVib)>0.01){

}

  kick();
}
function stopGesture(){ gest=null; clearArt(); target.velum=baseVelum; kick(); }
const VPC = 1;
// 喉頭蓋の芯（根元から先まで）からの近さ：近いほど1、離れるとなめらかに0
const epiNear=(x0,y0)=>{ const vx=EPI_T[0]-EPI_B[0], vy=EPI_T[1]-EPI_B[1], L2=vx*vx+vy*vy; let t=((x0-EPI_B[0])*vx+(y0-EPI_B[1])*vy)/L2; t=Math.max(0,Math.min(1.2,t)); const d=Math.hypot(x0-EPI_B[0]-t*vx, y0-EPI_B[1]-t*vy); return Math.exp(-((d/11)**2))*ss(-0.25,0.35,((x0-EPI_B[0])*vx+(y0-EPI_B[1])*vy)/L2); };
const ROOT_EPI=0.8, ROOT_DX=22, ROOT_DY=6, ROOT_C=[300,560], ROOT_R=[30,36];
// 間違った下げ方で、舌の付け根のまわりが奥へ押し出される量（なめらかな広がり）
const rootShift=(x0,y0)=>{ if(state.root<=0.001) return [0,0]; const g=Math.exp(-(((x0-ROOT_C[0])/ROOT_R[0])**2)-(((y0-ROOT_C[1])/ROOT_R[1])**2))*state.root; return [ROOT_DX*g, ROOT_DY*g]; };   // 間違った下げ方で、舌の付け根が奥へ寄る量
const SEP2=2.7, SEP_NG=3.2; let SOFT_GAP=18;   // 2番の子音・か゚：くっつく時に、色線どうしが重ならない程度に離す量
function stepGesture(now){
  if(!gest) return;
  const c=CONS[gest.ipa], kind=kindKey(gest.ipa);
  const cyc = 1800, t=(now-gest.t0)%cyc;
  let phase='vowel', gap=0, rel=0;
  if(kind==='stop'||kind==='nasal'){ if(t<650){ phase='cons'; gap=5; } }
  else if(kind==='stopSoft'){ if(t<750){ phase='cons'; gap=SOFT_GAP; } }
  else if(kind==='fric'){ if(t<750){ phase='cons'; gap=11; } }
  else if(kind==='affr'){ if(t<750){ phase='cons'; gap=11; } }   // 図では「s」と同じ動き（くっつく一瞬は説明文で）
  else if(kind==='tap'){ if(t<650){ phase='cons'; gap=5; } }
  else if(kind==='appr'){ if(t<650){ phase='cons'; gap=15; } }
  else if(kind==='glot'){ if(t<700){ phase='cons'; } }
  clearArt();
  if(phase==='cons'){
    if(c.p==='L'){ target.lips=1; target.lipGap = kind==='appr'?8 : (gap<8?-0.6:3); }
    else if(c.p!=='G'){ target['c'+c.p]=1-rel; target.gap=gap; target.sep = c.p===2 ? SEP2 : gest.ipa==='ŋ' ? SEP_NG : 0; }
    target.velum = velumUpFor(kind) ? VPC : 0;
    target.fold = VOICELESS.has(gest.ipa) ? 0 : 1;
  } else {
    target.velum = 0; target.fold = 1;
  }
}

const KEYS = ['velum','epi','lips','lipGap','lar','root','fold','gap','sep','c2','c3','c4','c5',...V];
const state={}, target={}; KEYS.forEach(k=>{state[k]=0; target[k]=0;}); state.epi=target.epi=EPI_UP;
const SPEED = {velum:.15, epi:.06, lar:.05, root:.05, fold:.18, c2:.3, c3:.3, c4:.3, c5:.3, gap:.3, sep:.3, lips:.3, lipGap:.3};
let raf=null, needRender=true;
function kick(){ needRender=true; if(!raf) raf=requestAnimationFrame(loop); }
function loop(now){
  stepGesture(now);
  let moving=false;
  for(const k of KEYS){
    const diff=target[k]-state[k];
    if(Math.abs(diff)>0.0015){ state[k]+=diff*(SPEED[k]||0.15); moving=true; } else state[k]=target[k];
  }
  if(moving||gest||needRender){ render(now); needRender=false; } else drawVF(now);
  raf = (moving||gest||state.fold>0.6) ? requestAnimationFrame(loop) : null;
}

// ===== ボタン =====
const chipSet=(btn,st,on)=>{ const s=btn.querySelector('.st'); if(s.textContent!==st) s.textContent=st; if(on!==undefined) btn.classList.toggle('on',on); };
const btnVelum = document.getElementById('btnVelum');
let velumUp=false, baseVelum=0;
function setVelum(up){
  velumUp=up; baseVelum = up?1:0;
  if(!gest) target.velum = baseVelum;
  kick();
}
btnVelum.onclick = ()=>{
  if(gest){ clearSel(); stopGesture(); target.fold=0; }
  setVelum(!velumUp);
  info.innerHTML = velumUp
    ? '<div class="ihead"><span class="big">⬆︎</span><b class="iname">軟口蓋が上がっている</b></div><p>口蓋がほぼ水平になるまで上がり、咽頭後壁にくっついて鼻腔への道を通せんぼします。母音をこの状態で歌うと、せまい空間だけで響かせることになります。</p>'
    : '<div class="ihead"><span class="big">⬇︎</span><b class="iname">軟口蓋が下がっている</b></div><p>鼻腔への道が開いて、鼻腔の響きも使えます。母音を歌う時は、この状態を保ちましょう。</p>';
};
// 喉頭蓋：起き上がる ⇄ 倒れがち。「フタ（飲み込む時）」は説明欄のボタンから見る
// 喉の響鳴空間：ふつう ⇄ 広げる。「広げる」の時は、説明欄で 正しい下げ方 ⇄ 間違った下げ方
let epiDown=false, epiLid=false, larOn=false, larWrong=false;
const btnEpi=document.getElementById('btnEpi'), btnLar=document.getElementById('btnLar');
const epiFallen=()=>epiDown || (larOn && larWrong);
function applyThroat(){
  if(epiLid){ target.epi=1; target.lar=-0.9; target.root=0; }
  else { target.epi = epiFallen() ? 0.5 : EPI_UP; target.lar = larOn?1:0; target.root = (larOn&&larWrong)?1:0; }
  chipSet(btnEpi, epiLid?'フタ（飲み込む時）':epiFallen()?'倒れがち':'起き上がる', epiLid||epiFallen());
  chipSet(btnLar, !larOn?'ふつう':larWrong?'押し下げ ×':'広げる', larOn);
  kick();
}
function endLid(){ if(epiLid){ epiLid=false; applyThroat(); } }
const EPI_TXT={
  up:'<div class="ihead"><span class="big" style="color:#b8325f">｜</span><b class="iname">喉頭蓋が起き上がる</b></div><p>のどの入り口が大きく開いて、声がまっすぐ通ります。</p>',
  down:'<div class="ihead"><span class="big" style="color:#b8325f">／</span><b class="iname">喉頭蓋が倒れがち</b><button class="mini" id="lidBtn">飲み込む時はどうなる？ ▶</button></div><p>のどの入り口がせまくなり、息苦しくなったり、声が暗くなったりこもったりします。気を付けよう！</p>',
  lid:'<div class="ihead"><span class="big" style="color:#b8325f">―</span><b class="iname">物を飲み込む時</b><button class="mini" id="lidBtn">◀ もどる</button></div><p>喉頭が持ち上がり、喉頭蓋が倒れて完全にフタをします。食べ物が気管に入らないようにするためです。</p>'};
const LAR_TXT={
  off:'<div class="ihead"><span class="big" style="color:#16736f">↕</span><b class="iname">ふつうの位置</b></div><p>喉仏が上がると、声帯から上の空間がせまくなります。</p>',
  ok:'<div class="ihead"><span class="big" style="color:#16736f">↕</span><b class="iname">喉の響鳴空間を広げる</b><span class="seg" id="larSeg"><button data-w="0" class="on" style="--sc:#16736f">○ 正しい</button><button data-w="1" style="--sc:#d93d17">× 間違い</button></span></div><p>喉仏（声帯の位置）が下がると、声帯から上の空間が縦に広がります。喉頭蓋はまっすぐ起き上がったまま、のどの入り口も広く開いています。</p>',
  ng:'<div class="ihead"><span class="big" style="color:#d93d17">×</span><b class="iname">間違った下げ方</b><span class="seg" id="larSeg"><button data-w="0" style="--sc:#16736f">○ 正しい</button><button data-w="1" class="on" style="--sc:#d93d17">× 間違い</button></span></div><p>喉仏を舌の付け根で押し下げてしまった形です。舌の付け根が奥へ寄り、その下の喉頭蓋も押されて倒れがちになります。のどの入り口がせまくなって、こもった暗い声になります。下げればいいわけではなく、下げ方が大事です。</p>'};
btnEpi.onclick=()=>{
  if(epiLid){ epiLid=false; epiDown=false; larWrong=false; }
  else if(epiFallen()){ epiDown=false; larWrong=false; }
  else epiDown=true;
  applyThroat(); info.innerHTML = epiFallen()?EPI_TXT.down:EPI_TXT.up;
};
btnLar.onclick=()=>{
  epiLid=false; larOn=!larOn; larWrong=false; applyThroat();
  info.innerHTML = larOn?LAR_TXT.ok:LAR_TXT.off;
};
info.addEventListener('click', e=>{
  const lb=e.target.closest('#larSeg button');
  if(lb){ const w=lb.dataset.w==='1'; if(w!==larWrong){ larWrong=w; applyThroat(); info.innerHTML = larWrong?LAR_TXT.ng:LAR_TXT.ok; } }
  else if(e.target.closest('#lidBtn')){
    epiLid=!epiLid;
    if(epiLid){ if(gest){ clearSel(); stopGesture(); } V.forEach(x=>target[x]=0); target.fold=0; }
    applyThroat(); info.innerHTML = epiLid?EPI_TXT.lid:EPI_TXT.down;
  }
});
const btnFold = document.getElementById('btnFold');
function toggleFold(){
  if(gest){ clearSel(); stopGesture(); }
  target.fold = target.fold>0.5 ? 0 : 1; kick();
  const closed = target.fold>0.5;
  info.innerHTML = closed
    ? '<div class="ihead"><span class="big" style="color:var(--c6)">6</span><b class="iname">発声時（声を出しているとき）</b></div><p>声帯が閉じて、息で細かくふるえて声になります。本物は1秒に数百回ふるえるので、図ではゆっくり見せています。</p>'
    : '<div class="ihead"><span class="big" style="color:var(--c6)">6</span><b class="iname">安静時（息をしているとき）</b></div><p>声帯が開いて、息がそのまま通ります。</p>';
}
btnFold.onclick = toggleFold;
document.getElementById('vfPanel').addEventListener('click', toggleFold);
const btnFlow = document.getElementById('btnFlow');
btnFlow.onclick = ()=>{ flowOn=!flowOn; chipSet(btnFlow, flowOn?'表示する':'表示しない', flowOn); kick(); };
const btnNames = document.getElementById('btnNames');
btnNames.onclick = ()=>{ const on=document.getElementById('names').classList.toggle('show'); fig.classList.toggle('nolbl',!on); chipSet(btnNames, on?'表示する':'表示しない', on); };
function syncButtons(){
  chipSet(btnVelum, state.velum>0.5?'上がっている':'下がっている', state.velum>0.5);
  chipSet(btnFold, state.fold>0.5?'閉じている':'開いている', state.fold>0.5);
}

render(0);

</script>
</body>
</html>
